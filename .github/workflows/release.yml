name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -e ./core
          python -m pip install pyinstaller

      - name: Prepare signing certificate
        shell: pwsh
        env:
          KOVA_SIGN_PFX_BASE64: ${{ secrets.KOVA_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:KOVA_SIGN_PFX_BASE64) {
            Write-Host "signing certificate is not configured"
            return
          }
          $path = Join-Path $env:RUNNER_TEMP "kova-sign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KOVA_SIGN_PFX_BASE64))
          "KOVA_SIGN_PFX=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installers
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Release manifest and signature
        shell: pwsh
        env:
          KOVA_VERSION: ${{ github.ref_name }}
          KOVA_SIGN_PFX_PASSWORD: ${{ secrets.KOVA_SIGN_PFX_PASSWORD }}
        run: ./scripts/release.ps1 -SkipBuild -Version "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: kova-hub-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            release/manifest.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            release/manifest.json
