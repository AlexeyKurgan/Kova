name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -e ./core
          python -m pip install pyinstaller

      - name: Build installers
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Release manifest
        shell: pwsh
        env:
          KOVA_VERSION: ${{ github.ref_name }}
        run: ./scripts/release.ps1 -SkipBuild -Version "${{ github.ref_name }}"

      - name: Install smoke test
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Stop-Kova {
            Get-Process -ErrorAction SilentlyContinue |
              Where-Object { $_.ProcessName -match '^kova' } |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }
          $msi = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI not found" }
          Write-Host "Installing $($msi.Name)"
          $install = Start-Process msiexec.exe -ArgumentList @("/i", "`"$($msi.FullName)`"", "/qn", "/norestart") -PassThru
          if (-not $install.WaitForExit(240000)) {
            $install.Kill()
            throw "MSI install timed out"
          }
          if ($install.ExitCode -ne 0) { throw "MSI install failed: $($install.ExitCode)" }
          $exe = Get-ChildItem "$env:ProgramFiles\Kova Hub" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Installed executable not found" }
          Write-Host "Starting $($exe.FullName)"
          $app = Start-Process -FilePath $exe.FullName -PassThru
          $healthy = $false
          try {
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8765/health" -TimeoutSec 2
                if ($health.status -eq "ok") { $healthy = $true; break }
              } catch { }
            }
          } finally {
            if ($app -and -not $app.HasExited) {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            }
            Stop-Kova
          }
          if (-not $healthy) { throw "Installed app did not start Core" }
          Start-Sleep -Seconds 2
          Write-Host "Uninstalling"
          $remove = Start-Process msiexec.exe -ArgumentList @("/x", "`"$($msi.FullName)`"", "/qn", "/norestart") -PassThru
          if (-not $remove.WaitForExit(240000)) {
            $remove.Kill()
            throw "MSI uninstall timed out"
          }
          Write-Host "Install smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: kova-hub-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            release/manifest.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            release/manifest.json
