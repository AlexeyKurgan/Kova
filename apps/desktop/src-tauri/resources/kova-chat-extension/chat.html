<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http://127.0.0.1:8765; img-src http://127.0.0.1:8765 data:; media-src http://127.0.0.1:8765 data:;">
<style>
:root {
  --gold: #d9a441;
  --gold-soft: rgba(217, 164, 65, 0.12);
  --gold-line: rgba(217, 164, 65, 0.34);
  --bg: var(--vscode-sideBar-background, #0f1319);
  --card: var(--vscode-sideBarSectionHeader-background, #151a22);
  --inset: var(--vscode-input-background, #1b222c);
  --fg: var(--vscode-foreground, #c2c8d2);
  --strong: var(--vscode-sideBarTitle-foreground, #eef1f6);
  --muted: var(--vscode-descriptionForeground, #758296);
  --border: var(--vscode-panel-border, #252b35);
  --danger: #e26d6d;
  --success: #5cc8a1;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  position: relative;
  display: flex;
  flex-direction: column;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font: 12px/1.55 var(--vscode-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
}
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: 0.45; cursor: default; }

.top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px 9px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; min-width: 0; flex: 1; align-items: center; gap: 9px; }
.brand-mark {
  display: grid;
  width: 30px;
  height: 30px;
  flex: none;
  place-items: center;
  border: 1px solid var(--gold-line);
  border-radius: 8px;
  background: var(--gold-soft);
  color: var(--gold);
}
.brand-copy { display: flex; min-width: 0; flex-direction: column; }
.brand-copy b { color: var(--strong); font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.brand-copy small { overflow: hidden; color: var(--muted); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.top-actions { display: flex; align-items: center; flex: none; gap: 3px; }
.icon-btn {
  display: grid;
  width: 30px;
  height: 30px;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  color: var(--muted);
}
.icon-btn:hover, .icon-btn.is-active { border-color: var(--border); background: var(--card); color: var(--strong); }
.icon-btn svg { width: 15px; height: 15px; }

.history-panel {
  position: absolute;
  z-index: 20;
  top: 51px;
  right: 8px;
  bottom: 8px;
  display: none;
  width: min(360px, calc(100% - 16px));
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
}
.history-panel.is-open { display: flex; }
.history-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.history-head b { color: var(--strong); font-size: 12px; }
.history-search { margin: 8px 10px; }
.history-search input {
  width: 100%;
  height: 32px;
  padding: 0 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  outline: none;
  font-size: 11px;
}
.history-list { display: flex; min-height: 0; flex: 1; flex-direction: column; gap: 2px; overflow-y: auto; padding: 0 6px 8px; }
.history-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 7px; cursor: pointer; }
.history-item:hover { background: var(--card); }
.history-item.is-active { background: var(--gold-soft); }
.history-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; }
.history-copy b { overflow: hidden; color: var(--fg); font-size: 11px; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
.history-copy small { overflow: hidden; color: var(--muted); font-size: 9.5px; text-overflow: ellipsis; white-space: nowrap; }
.history-date { color: var(--muted); font-size: 9px; }

.context-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.segmented { display: flex; flex: none; padding: 2px; border: 1px solid var(--border); border-radius: 7px; background: var(--inset); }
.segmented button {
  height: 26px;
  padding: 0 9px;
  border: 0;
  border-radius: 5px;
  background: none;
  color: var(--muted);
  font-size: 10.5px;
}
.segmented button.is-active { background: var(--card); color: var(--strong); box-shadow: 0 0 0 1px var(--border); }
.context-bar select {
  height: 32px;
  min-width: 0;
  flex: 1;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--fg);
  font-size: 11px;
  outline: none;
}
.context-bar select:focus { border-color: var(--gold-line); }
.context-bar .icon-btn { flex: none; }
.quick-btn {
  height: 32px;
  flex: none;
  padding: 0 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--muted);
  font-size: 10.5px;
}
.quick-btn:hover { border-color: var(--gold-line); color: var(--gold); }
.settings-panel {
  display: none;
  flex-direction: column;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--card);
}
.settings-panel.is-open { display: flex; }
.settings-panel label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 9.5px; }
.settings-panel select {
  height: 34px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--fg);
  font-size: 11px;
  outline: none;
}
.settings-actions { display: flex; gap: 6px; }
.settings-actions button {
  height: 32px;
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--fg);
  font-size: 10.5px;
}
.settings-actions button.primary { border-color: var(--gold); background: var(--gold); color: #1a1409; font-weight: 650; }

.thread {
  display: flex;
  min-height: 0;
  flex: 1;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  padding: 16px 14px 22px;
  scrollbar-width: thin;
}
.thread::-webkit-scrollbar { width: 7px; }
.thread::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.welcome { display: flex; flex-direction: column; padding: 10px 4px; }
.hero { display: flex; align-items: center; flex-direction: column; gap: 8px; padding: 18px 8px 22px; text-align: center; }
.cat { width: 118px; color: var(--gold); overflow: visible; filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.3)); animation: float 4.2s ease-in-out infinite; }
.cat path, .cat ellipse, .cat circle { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.cat .tail { transform-box: fill-box; transform-origin: 12% 80%; animation: tail 2.6s ease-in-out infinite; }
.cat .eyes { transform-box: fill-box; transform-origin: center; animation: catblink 5.2s infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes tail { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
@keyframes catblink { 0%, 91%, 100% { opacity: 1; } 94%, 96% { opacity: 0; } }
.hero h1 { margin: 0; color: var(--strong); font-size: 23px; font-weight: 600; letter-spacing: -0.02em; }
.hero h1 em { color: var(--gold); font-style: italic; }
.hero p { max-width: 320px; margin: 0; color: var(--muted); font-size: 11.5px; line-height: 1.55; }
.suggestions { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
.suggestion {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 11px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--fg);
  text-align: left;
  font-size: 11px;
}
.suggestion:hover { border-color: var(--gold-line); background: var(--gold-soft); }
.suggestion svg { width: 15px; height: 15px; flex: none; color: var(--gold); }
.recent-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.recent-head b { color: var(--strong); font-size: 11px; }
.recent-head button { border: 0; background: none; color: var(--gold); font-size: 10px; }
.recent-list { display: flex; flex-direction: column; gap: 2px; }
.recent-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 7px; cursor: pointer; }
.recent-item:hover { background: var(--card); }
.recent-item span { display: flex; min-width: 0; flex: 1; flex-direction: column; }
.recent-item b { overflow: hidden; color: var(--fg); font-size: 11px; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }
.recent-item small { overflow: hidden; color: var(--muted); font-size: 9.5px; text-overflow: ellipsis; white-space: nowrap; }
.recent-item time { color: var(--muted); font-size: 9px; }

.msg { display: flex; flex-direction: column; gap: 5px; }
.msg.user { align-items: flex-end; }
.msg-head { display: flex; align-items: center; gap: 6px; }
.msg-avatar { display: grid; width: 24px; height: 24px; place-items: center; border-radius: 6px; background: var(--card); color: var(--muted); }
.msg.assistant .msg-avatar { background: var(--gold-soft); color: var(--gold); }
.msg-name { color: var(--muted); font-size: 9.5px; }
.msg-body { width: 100%; color: var(--fg); font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user .msg-body { width: auto; max-width: 90%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 12px 12px 3px 12px; background: var(--card); }
.msg-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; }
.msg.user .msg-foot { justify-content: flex-end; }
.msg-foot small { color: var(--muted); font-size: 8.5px; }
.link-btn { border: 0; background: none; padding: 2px 0; color: var(--gold); font-size: 9px; }
.link-btn:hover { text-decoration: underline; }
.msg.stream .msg-body { color: var(--muted); font-family: var(--vscode-editor-font-family, Consolas, monospace); font-size: 11px; }
.thinking { display: inline-flex; gap: 3px; margin-left: 4px; }
.thinking i { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: 0.3; animation: blink 1.1s infinite; }
.thinking i:nth-child(2) { animation-delay: 0.15s; }
.thinking i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

.media { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0; }
.media img, .media video { display: block; width: 180px; max-width: 100%; max-height: 220px; border: 1px solid var(--border); border-radius: 9px; object-fit: cover; background: #000; }
.file-card { display: flex; align-items: center; gap: 8px; min-width: 190px; max-width: 300px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--fg); text-decoration: none; }
.file-card:hover { border-color: var(--gold-line); }
.file-card span { display: flex; min-width: 0; flex: 1; flex-direction: column; }
.file-card b { overflow: hidden; font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
.file-card small { color: var(--muted); font-size: 9px; }

.action { display: flex; flex-direction: column; gap: 6px; padding: 9px; border: 1px solid var(--gold-line); border-radius: 8px; background: var(--gold-soft); }
.action.is-approved { border-color: rgba(92, 200, 161, 0.4); background: rgba(92, 200, 161, 0.07); }
.action.is-rejected, .action.is-failed { border-color: rgba(226, 109, 109, 0.35); background: rgba(226, 109, 109, 0.06); }
.action-head { display: flex; align-items: flex-start; gap: 7px; }
.action-icon { display: grid; width: 24px; height: 24px; flex: none; place-items: center; border-radius: 6px; background: rgba(217, 164, 65, 0.16); color: var(--gold); }
.action-copy { display: flex; min-width: 0; flex-direction: column; gap: 1px; }
.action-copy b { color: var(--strong); font-size: 11px; }
.action-copy small { color: var(--muted); font-size: 9.5px; overflow-wrap: anywhere; }
.action-buttons { display: flex; gap: 6px; }
.action-buttons button { height: 28px; padding: 0 10px; border: 1px solid var(--border); border-radius: 5px; background: var(--inset); color: var(--fg); font-size: 9.5px; }
.action-buttons button.primary { border-color: var(--gold); background: var(--gold); color: #1a1409; font-weight: 650; }
.action-state { color: var(--muted); font-size: 9.5px; }
.action-state.is-approved { color: var(--success); }
.action-state.is-rejected, .action-state.is-failed { color: var(--danger); }
.action-error { color: var(--danger); font-size: 9.5px; overflow-wrap: anywhere; }

.attach { display: none; align-items: center; gap: 6px; margin: 0 12px; padding: 6px 8px; border: 1px solid var(--gold-line); border-radius: 6px; background: var(--gold-soft); font-size: 9.5px; }
.attach.show { display: flex; }
.attach span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach button { display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--muted); }
.pending { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 7px; }
.pending:empty { display: none; }
.pending-item { position: relative; display: flex; width: 150px; height: 56px; align-items: center; gap: 7px; padding: 6px 7px; border: 1px solid var(--gold-line); border-radius: 7px; background: var(--card); }
.pending-item img, .pending-item video { width: 40px; height: 40px; flex: none; border-radius: 5px; object-fit: cover; background: #000; }
.pending-item > svg { flex: none; color: var(--gold); }
.pending-item span { display: flex; min-width: 0; flex: 1; flex-direction: column; }
.pending-item b { overflow: hidden; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
.pending-item small { color: var(--muted); font-size: 8px; }
.pending-item > button { position: absolute; top: 2px; right: 2px; display: grid; width: 18px; height: 18px; place-items: center; border: 1px solid var(--border); border-radius: 50%; background: var(--bg); color: var(--muted); font-size: 10px; }

.composer { padding: 8px 12px 11px; border-top: 1px solid var(--border); background: var(--bg); }
.composer-box { display: flex; align-items: flex-end; gap: 7px; padding: 7px 7px 7px 10px; border: 1px solid var(--border); border-radius: 11px; background: var(--inset); }
.composer-box:focus-within { border-color: var(--gold-line); box-shadow: 0 0 0 2px rgba(217, 164, 65, 0.1); }
.composer textarea { min-height: 38px; max-height: min(300px, 42vh); flex: 1; resize: none; padding: 3px 0; border: 0; background: none; color: var(--fg); font-size: 12px; line-height: 1.5; outline: none; }
.composer-tools { display: flex; gap: 4px; }
.tool-btn { display: grid; width: 32px; height: 32px; place-items: center; border: 1px solid transparent; border-radius: 7px; background: none; color: var(--muted); }
.tool-btn:hover { border-color: var(--border); background: var(--card); color: var(--gold); }
.send-btn { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid var(--gold); border-radius: 8px; background: var(--gold); color: #1a1409; }
.send-btn:disabled { opacity: 0.4; }
.tool-btn svg, .send-btn svg { width: 15px; height: 15px; }
.composer-hint { margin: 5px 2px 0; color: var(--muted); font-size: 8.5px; text-align: right; }

.error { display: none; align-items: center; gap: 7px; margin: 0 12px 7px; padding: 7px 9px; border: 1px solid rgba(226, 109, 109, 0.35); border-radius: 6px; background: rgba(226, 109, 109, 0.08); color: var(--danger); font-size: 10px; }
.error.show { display: flex; }
.error span { flex: 1; }
.error button { border: 0; background: none; color: var(--danger); font-size: 14px; line-height: 1; }

.empty-tip { margin: auto; padding: 20px; color: var(--muted); font-size: 11px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .cat, .cat .tail, .cat .eyes, .thinking i { animation: none; } }

/* final control sizing */
.icon-btn { width: 32px; height: 32px; }
.segmented button { height: 30px; padding: 0 11px; font-size: 11.5px; }
.context-bar select { height: 34px; font-size: 11.5px; }
.quick-btn { height: 34px; font-size: 11px; }
.brand-copy b { font-size: 14px; }
.brand-copy small { font-size: 10.5px; }
.hero p { font-size: 12px; }
.suggestion { padding: 11px; font-size: 11.5px; }
.msg-body { font-size: 13px; }
.msg.user .msg-body { padding: 10px 13px; }
.composer textarea { min-height: 42px; font-size: 12.5px; max-height: min(300px, 42vh); overflow-y: auto; }
.tool-btn { width: 34px; height: 34px; }
.send-btn { width: 36px; height: 36px; }

.msg-body h1, .msg-body h2, .msg-body h3 { margin: 8px 0 4px; color: var(--strong); line-height: 1.3; }
.msg-body h1 { font-size: 16px; }
.msg-body h2 { font-size: 14px; }
.msg-body h3 { font-size: 13px; }
.msg-body strong { color: var(--strong); font-weight: 650; }
.msg-body .li { padding-left: 2px; }
.msg-body .inline { padding: 1px 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--inset); color: var(--strong); font-family: var(--vscode-editor-font-family, Consolas, monospace); font-size: 0.92em; }
.msg-body .code { margin: 7px 0; padding: 9px 10px; overflow-x: auto; border: 1px solid var(--border); border-radius: 7px; background: #0c1117; color: #c9d5e2; font: 10.5px/1.55 var(--vscode-editor-font-family, Consolas, monospace); white-space: pre-wrap; word-break: break-word; }

.editor-model-groups {
  display: flex;
  max-height: 230px;
  flex-direction: column;
  gap: 1px;
  overflow-y: auto;
  padding: 3px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--inset);
}
.editor-model-group { display: flex; flex-direction: column; gap: 1px; padding-bottom: 3px; }
.editor-model-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 7px 2px;
  color: var(--muted);
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.editor-model-head b { font-size: 8px; font-weight: 500; opacity: 0.8; }
.editor-model-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 7px;
  border: 0;
  border-radius: 5px;
  background: none;
  color: var(--fg);
  text-align: left;
  font-size: 9.5px;
}
.editor-model-row:hover { background: var(--card); }
.editor-model-row.is-active { background: var(--gold-soft); color: var(--gold); }
.editor-model-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.editor-model-row em { padding: 1px 4px; border-radius: 3px; background: rgba(92, 200, 161, 0.12); color: var(--success); font-size: 7.5px; font-style: normal; }
.editor-model-empty { padding: 8px; color: var(--muted); font-size: 9px; }
.history-delete {
  display: grid;
  width: 24px;
  height: 24px;
  flex: none;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 5px;
  background: none;
  color: var(--muted);
  font-size: 13px;
}
.history-delete:hover { border-color: var(--border); color: var(--danger); }
.history-confirm { display: flex; align-items: center; gap: 3px; }
.history-confirm button {
  height: 24px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--inset);
  color: var(--muted);
  font-size: 8px;
}
.history-confirm button.is-danger { border-color: rgba(226, 109, 109, 0.4); color: var(--danger); }

.context-bar { position: relative; }
.context-trigger {
  display: flex;
  height: 32px;
  min-width: 0;
  flex: 1;
  align-items: center;
  gap: 7px;
  padding: 0 9px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--fg);
  text-align: left;
  font-size: 11px;
}
.context-trigger:hover, .context-trigger:focus { border-color: var(--gold-line); outline: none; }
.context-trigger > span:nth-child(2) { overflow: hidden; flex: 1; text-overflow: ellipsis; white-space: nowrap; }
.context-trigger svg { flex: none; color: var(--muted); }
.context-icon {
  display: grid;
  width: 20px;
  height: 20px;
  flex: none;
  place-items: center;
  border-radius: 5px;
  background: var(--gold-soft);
  color: var(--gold);
  font-size: 10px;
}
.context-menu {
  position: absolute;
  z-index: 35;
  top: calc(100% + 4px);
  right: 12px;
  left: 12px;
  display: none;
  flex-direction: column;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
}
.context-menu.is-open { display: flex; }
.context-menu > input {
  height: 32px;
  margin: 8px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--fg);
  font-size: 10.5px;
  outline: none;
}
.context-menu > input:focus { border-color: var(--gold-line); }
.context-menu-list { display: flex; max-height: 320px; flex-direction: column; overflow-y: auto; padding: 0 5px 6px; }
.context-option {

}

.context-check {
  display: grid;

  height: 17px;
  flex: none;
  place-items: center;
  border: 1px solid var(--border);

}

.context-option-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 2px; }
.context-option-copy b { overflow: hidden; font-size: 10.5px; font-weight: 550; text-overflow: ellipsis; white-space: nowrap; }

.task-kind, .task-engine { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 8px; }

.task-engine img { display: block; width: 15px; height: 15px; object-fit: contain; }
.type-badge, .engine-badge { border: 0 !important; background: none !important; padding: 0 !important; }
.kova-avatar {
  --kova-fur: #323b4b;
  --kova-fur-shadow: #262d3a;
  --kova-cream: #efe8dc;
  --kova-ear-inner: #e5c394;
  --kova-outline: #1e2430;
  --kova-gold: #d6992e;
  --kova-success: #229965;
  --kova-error: #d14949;
  --kova-white: #ffffff;
  display: inline-block;
  flex-shrink: 0;
  user-select: none;
  overflow: visible;
}

.kova-avatar .kova-whole { transform-origin: 72px 136px; }
.kova-avatar .kova-head { transform-origin: 72px 78px; }
.kova-avatar .kova-ear-l { transform-origin: 48px 50px; }
.kova-avatar .kova-ear-r { transform-origin: 96px 50px; }
.kova-avatar .kova-tail { transform-origin: 94px 128px; }
.kova-avatar .kova-paw-l { transform-origin: 59px 134px; }
.kova-avatar .kova-paw-r { transform-origin: 85px 134px; }
.kova-avatar .kova-eyes-open { transform-origin: 72px 69px; }
.kova-avatar .kova-pupils { transform-origin: 72px 69px; }
.kova-avatar .kova-pendant { transform-origin: 72px 104px; }

.kova-avatar .kova-eyes-happy,
.kova-avatar .kova-eyes-sleep,
.kova-avatar .kova-eyes-error,
.kova-avatar .kova-prop { display: none; }

.kova-avatar[data-state="idle"] .kova-whole { animation: kova-breathe 3.4s ease-in-out infinite; }
.kova-avatar[data-state="idle"] .kova-tail { animation: kova-tail-sway 3.2s ease-in-out infinite; }
.kova-avatar[data-state="idle"] .kova-eyes-open { animation: kova-blink 4.6s ease-in-out infinite; }
.kova-avatar[data-state="idle"] .kova-ear-r { animation: kova-ear-twitch 5.5s ease-in-out infinite; }

.kova-avatar[data-state="thinking"] .kova-prop-thinking { display: block; }
.kova-avatar[data-state="thinking"] .kova-head { animation: kova-head-tilt 2.6s ease-in-out infinite; }
.kova-avatar[data-state="thinking"] .kova-pupils { transform: translate(2px, -2px); }
.kova-avatar[data-state="thinking"] .kova-tail { animation: kova-tail-sway 4.2s ease-in-out infinite; }
.kova-avatar[data-state="thinking"] .kova-dot-1 { animation: kova-dot-pulse 1.4s ease-in-out infinite 0s; }
.kova-avatar[data-state="thinking"] .kova-dot-2 { animation: kova-dot-pulse 1.4s ease-in-out infinite 0.22s; }
.kova-avatar[data-state="thinking"] .kova-dot-3 { animation: kova-dot-pulse 1.4s ease-in-out infinite 0.44s; }

.kova-avatar[data-state="coding"] .kova-prop-coding { display: block; }
.kova-avatar[data-state="coding"] .kova-head { animation: kova-nod-fast 1.2s ease-in-out infinite; }
.kova-avatar[data-state="coding"] .kova-paw-l { animation: kova-type-paw 0.36s ease-in-out infinite; }
.kova-avatar[data-state="coding"] .kova-paw-r { animation: kova-type-paw 0.36s ease-in-out infinite 0.18s; }
.kova-avatar[data-state="coding"] .kova-code-badge { transform-origin: 122px 44px; animation: kova-float 1.8s ease-in-out infinite; }

.kova-avatar[data-state="reading"] .kova-prop-reading { display: block; }
.kova-avatar[data-state="reading"] .kova-whole { animation: kova-breathe 3.6s ease-in-out infinite; }
.kova-avatar[data-state="reading"] .kova-pupils { animation: kova-read-scan 2.2s ease-in-out infinite; }
.kova-avatar[data-state="reading"] .kova-book { transform-origin: 124px 66px; animation: kova-float 2.6s ease-in-out infinite; }

.kova-avatar[data-state="searching"] .kova-prop-searching { display: block; }
.kova-avatar[data-state="searching"] .kova-pupils { animation: kova-search-eyes 2.4s ease-in-out infinite; }
.kova-avatar[data-state="searching"] .kova-head { animation: kova-head-look 2.4s ease-in-out infinite; }
.kova-avatar[data-state="searching"] .kova-loupe { transform-origin: 112px 62px; animation: kova-loupe-orbit 2.4s ease-in-out infinite; }

.kova-avatar[data-state="running"] .kova-prop-running { display: block; }
.kova-avatar[data-state="running"] .kova-whole { animation: kova-run-bob 0.7s ease-in-out infinite; }
.kova-avatar[data-state="running"] .kova-tail { animation: kova-tail-wag 0.65s ease-in-out infinite; }
.kova-avatar[data-state="running"] .kova-term-cursor { animation: kova-cursor-blink 0.8s steps(2, start) infinite; }

.kova-avatar[data-state="editing"] .kova-prop-editing { display: block; }
.kova-avatar[data-state="editing"] .kova-head { animation: kova-nod-fast 1.6s ease-in-out infinite; }
.kova-avatar[data-state="editing"] .kova-pupils { transform: translate(2px, 1px); }
.kova-avatar[data-state="editing"] .kova-pencil { transform-origin: 114px 74px; animation: kova-pencil-write 1.1s ease-in-out infinite; }

.kova-avatar[data-state="success"] .kova-eyes-open { display: none; }
.kova-avatar[data-state="success"] .kova-eyes-happy { display: block; }
.kova-avatar[data-state="success"] .kova-prop-success { display: block; }
.kova-avatar[data-state="success"] .kova-whole { animation: kova-happy-hop 1.15s ease-in-out infinite; }
.kova-avatar[data-state="success"] .kova-tail { animation: kova-tail-wag 0.55s ease-in-out infinite; }
.kova-avatar[data-state="success"] .kova-badge-pop { transform-origin: 120px 44px; animation: kova-badge-pulse 1.4s ease-in-out infinite; }

.kova-avatar[data-state="error"] .kova-eyes-open { display: none; }
.kova-avatar[data-state="error"] .kova-eyes-error { display: block; }
.kova-avatar[data-state="error"] .kova-prop-error { display: block; }
.kova-avatar[data-state="error"] .kova-whole { animation: kova-error-shake 2.2s ease-in-out infinite; }
.kova-avatar[data-state="error"] .kova-ear-l { transform: rotate(-16deg) translateY(3px); }
.kova-avatar[data-state="error"] .kova-ear-r { transform: rotate(16deg) translateY(3px); }
.kova-avatar[data-state="error"] .kova-badge-pop { transform-origin: 120px 44px; animation: kova-badge-pulse 1.2s ease-in-out infinite; }

.kova-avatar[data-state="sleeping"] .kova-eyes-open { display: none; }
.kova-avatar[data-state="sleeping"] .kova-eyes-sleep { display: block; }
.kova-avatar[data-state="sleeping"] .kova-prop-sleeping { display: block; }
.kova-avatar[data-state="sleeping"] .kova-whole { animation: kova-sleep-breathe 4.4s ease-in-out infinite; }
.kova-avatar[data-state="sleeping"] .kova-head { transform: translateY(3px) rotate(-4deg); }
.kova-avatar[data-state="sleeping"] .kova-ear-l { transform: rotate(-10deg) translateY(2px); }
.kova-avatar[data-state="sleeping"] .kova-ear-r { transform: rotate(10deg) translateY(2px); }
.kova-avatar[data-state="sleeping"] .kova-z1 { animation: kova-zzz 2.8s ease-out infinite 0s; }
.kova-avatar[data-state="sleeping"] .kova-z2 { animation: kova-zzz 2.8s ease-out infinite 1.4s; }

.kova-avatar[data-active="false"] * { animation: none !important; }

@media (prefers-reduced-motion: reduce) {
  .kova-avatar * { animation: none !important; }
}

@keyframes kova-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.018, 0.982); } }
@keyframes kova-sleep-breathe { 0%, 100% { transform: scale(1, 0.985); } 50% { transform: scale(1.03, 0.96); } }
@keyframes kova-blink { 0%, 44%, 48%, 94%, 98%, 100% { transform: scaleY(1); } 46%, 96% { transform: scaleY(0.08); } }
@keyframes kova-tail-sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(8deg); } }
@keyframes kova-tail-wag { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(13deg); } }
@keyframes kova-ear-twitch { 0%, 86%, 100% { transform: rotate(0deg); } 90% { transform: rotate(11deg); } 94% { transform: rotate(-3deg); } }
@keyframes kova-head-tilt { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
@keyframes kova-head-look { 0%, 100% { transform: rotate(0deg) translateX(0); } 50% { transform: rotate(4deg) translateX(2px); } }
@keyframes kova-nod-fast { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(2px) rotate(1.5deg); } }
@keyframes kova-type-paw { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes kova-read-scan { 0%, 100% { transform: translate(-2px, 1.5px); } 45% { transform: translate(2.5px, 1.5px); } 55% { transform: translate(2.5px, 2px); } 90% { transform: translate(-2px, 2px); } }
@keyframes kova-search-eyes { 0%, 100% { transform: translate(2px, -1px); } 50% { transform: translate(3px, 1px); } }
@keyframes kova-loupe-orbit { 0%, 100% { transform: translate(0, 0) rotate(-4deg); } 33% { transform: translate(4px, -4px) rotate(5deg); } 66% { transform: translate(-2px, 3px) rotate(-2deg); } }
@keyframes kova-run-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3.5px); } }
@keyframes kova-pencil-write { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(3px, -2px) rotate(8deg); } 50% { transform: translate(-2px, 2px) rotate(-6deg); } 75% { transform: translate(2px, 1px) rotate(5deg); } }
@keyframes kova-happy-hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 35% { transform: translateY(-6px) scale(0.98, 1.03); } 65% { transform: translateY(0) scale(1.03, 0.96); } }
@keyframes kova-error-shake { 0%, 72%, 100% { transform: translateX(0); } 78% { transform: translateX(-3px); } 84% { transform: translateX(3px); } 90% { transform: translateX(-2px); } 95% { transform: translateX(2px); } }
@keyframes kova-dot-pulse { 0%, 100% { opacity: 0.35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
@keyframes kova-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes kova-badge-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.09); } }
@keyframes kova-cursor-blink { 0% { opacity: 1; } 100% { opacity: 0; } }
@keyframes kova-zzz { 0% { opacity: 0; transform: translate(0, 8px) scale(0.7); } 25% { opacity: 1; } 80% { opacity: 0.9; } 100% { opacity: 0; transform: translate(9px, -16px) scale(1.15); } }


/* Kova avatar sizing and agent activity */
.hero .kova-avatar { width: 118px; height: 118px; }
.empty .kova-avatar { width: 100px; height: 100px; }
.msg-avatar .kova-avatar { display: block; width: 64px; height: 64px; }
.msg.assistant .msg-avatar { width: 64px; height: 64px; background: transparent; border: 0; }

.act { display: flex; flex-direction: column; gap: 3px; margin: 2px 0 5px; border: 1px solid var(--border); border-radius: 7px; background: rgba(255,255,255,.018); overflow: hidden; }
.act.is-running { border-color: var(--gold-line); background: var(--gold-soft); }
.act-head { display: flex; align-items: center; gap: 7px; padding: 7px 9px; color: var(--muted); font-size: 9px; list-style: none; cursor: pointer; }
.act.is-running .act-head { color: var(--gold); cursor: default; }
.act-head::-webkit-details-marker { display: none; }
.act-head > svg { margin-left: auto; }
.act[open] > .act-head > svg { transform: rotate(180deg); }
.act-spin { width: 11px; height: 11px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: act-spin .9s linear infinite; }
@keyframes act-spin { to { transform: rotate(360deg); } }
.act-dots { display: inline-flex; gap: 3px; }
.act-dots i { width: 3px; height: 3px; border-radius: 50%; background: currentColor; animation: act-dot 1.1s ease-in-out infinite; }
.act-dots i:nth-child(2) { animation-delay: .15s; }
.act-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes act-dot { 0%,100% { opacity: .3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }
.act-list { display: flex; flex-direction: column; gap: 1px; padding: 0 5px 5px; }
.act-row { border-radius: 5px; background: rgba(255,255,255,.018); }
.act-row > summary { display: flex; align-items: flex-start; gap: 7px; padding: 6px 7px; color: var(--fg); list-style: none; cursor: pointer; }
.act-row > summary::-webkit-details-marker { display: none; }
.act-ico { display: grid; width: 16px; height: 16px; flex: none; place-items: center; color: var(--muted); }
.act-ico svg { width: 13px; height: 13px; }
.act-row.is-error .act-ico { color: var(--danger); }
.act-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 1px; }
.act-copy b { font-size: 9px; font-weight: 550; }
.act-copy small { overflow: hidden; color: var(--muted); font-size: 8px; text-overflow: ellipsis; white-space: nowrap; }
.act-time { flex: none; color: var(--muted); font-size: 8px; }
.act-row pre { max-height: 250px; margin: 0; padding: 7px 9px; overflow: auto; border-top: 1px solid var(--border); background: #0b1016; color: #b8c5d4; font: 9px/1.5 var(--vscode-editor-font-family, Consolas, monospace); white-space: pre-wrap; word-break: break-word; }
.act-row > summary > svg:last-child { flex: none; color: var(--muted); }
.act-row[open] > summary > svg:last-child { transform: rotate(180deg); }

.msg-actions { display: inline-flex; align-items: center; gap: 9px; margin-left: auto; }
.msg-actions .link-btn.is-copied { color: var(--success, #3fb27f); }

.safety-strip { display: flex; align-items: center; gap: 6px; padding: 0 12px 7px; color: var(--muted); font-size: 8px; }
.safety-pill { display: inline-flex; align-items: center; padding: 2px 5px; border: 1px solid var(--gold-line); border-radius: 999px; background: var(--gold-soft); color: var(--gold); font-size: 7px; white-space: nowrap; }
.safety-pill.is-off { border-color: var(--danger); background: rgba(209,73,73,.12); color: var(--danger); }
.act-warn { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; color: var(--danger); font-size: 8px; }
.act-warn + .act-dots { margin-left: 2px; }
.act-head > .act-warn ~ svg { margin-left: 2px; }
.act-badge { display: inline-block; margin-left: 4px; padding: 1px 3px; border-radius: 3px; font-size: 6.5px; font-weight: 600; vertical-align: 1px; }
.act-badge.is-external { background: rgba(209,73,73,.14); color: var(--danger); }
.act-badge.is-sensitive { background: rgba(214,153,46,.14); color: var(--gold); }
.act-badge.is-network { background: rgba(90,140,220,.14); color: #7fa8ff; }

.settings-panel textarea { min-height: 62px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--panel); color: var(--fg); font: 9.5px/1.45 var(--vscode-editor-font-family, Consolas, monospace); resize: vertical; }
.settings-hint { color: var(--muted); font-size: 8.5px; line-height: 1.4; }

.consent-overlay { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 18px; background: rgba(4,8,14,.68); backdrop-filter: blur(3px); }
.consent-card { display: flex; width: min(360px, 100%); flex-direction: column; gap: 9px; padding: 15px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); box-shadow: 0 24px 70px rgba(0,0,0,.45); }
.consent-card b { font-size: 13px; }
.consent-card p { margin: 0; color: var(--fg); font-size: 10px; line-height: 1.5; opacity: .82; }
.consent-target { display: flex; flex-direction: column; gap: 2px; padding: 8px 9px; border: 1px solid var(--border); border-radius: 7px; background: rgba(255,255,255,.02); }
.consent-target strong { font-size: 10.5px; }
.consent-target span { color: var(--muted); font: 8.5px/1.4 var(--vscode-editor-font-family, Consolas, monospace); word-break: break-all; }
.consent-card small { color: var(--muted); font-size: 8.5px; line-height: 1.45; }
.consent-actions { display: flex; justify-content: flex-end; gap: 6px; }
.consent-actions button { padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--fg); font: inherit; font-size: 9px; cursor: pointer; }
.consent-actions button.primary { border-color: var(--gold-line); background: var(--gold); color: #17130c; font-weight: 650; }

.egress { display: flex; flex-direction: column; gap: 4px; margin: 2px 0 5px; padding: 6px 7px; border: 1px solid var(--border); border-radius: 7px; background: rgba(255,255,255,.018); }
.egress-head { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 8.5px; }
.egress-head b { margin-left: auto; padding-left: 8px; color: var(--muted); font-size: 8px; white-space: nowrap; }
.egress-files { color: var(--muted); font-size: 8.5px; }
.egress-files > summary { cursor: pointer; list-style: none; }
.egress-files > summary::-webkit-details-marker { display: none; }
.egress-files > summary::before { content: "▸ "; }
.egress-files[open] > summary::before { content: "▾ "; }
.egress-files ul { display: flex; flex-direction: column; gap: 2px; max-height: 150px; margin: 5px 0 0; padding: 0; overflow: auto; list-style: none; }
.egress-files li { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.egress-files li span { overflow: hidden; flex: 1; color: var(--fg); font: 8.5px/1.4 var(--vscode-editor-font-family, Consolas, monospace); text-overflow: ellipsis; white-space: nowrap; opacity: .8; }
.egress-files li small { flex: none; color: var(--muted); font-size: 8px; }

.msg-body strong { color: #e8c37a; font-weight: 650; }
.msg-body h1, .msg-body h2, .msg-body h3 { margin: 10px 0 5px; color: var(--gold); line-height: 1.3; }
.msg-body h1 { font-size: 15px; } .msg-body h2 { font-size: 13.5px; } .msg-body h3 { font-size: 12.5px; }
.msg-body h1:first-child, .msg-body h2:first-child, .msg-body h3:first-child { margin-top: 0; }
.msg-body p { margin: 0 0 7px; } .msg-body p:last-child { margin-bottom: 0; }
.msg-body ul, .msg-body ol { margin: 4px 0 7px; padding-left: 17px; }
.msg-body li { margin: 2px 0; }
.msg-body hr { height: 1px; margin: 10px 0; border: 0; background: var(--border); }
.msg-body a { color: var(--gold); text-decoration: underline; }
.msg-body .chat-callout { margin: 7px 0; padding: 7px 9px; border-left: 3px solid var(--gold); border-radius: 0 6px 6px 0; background: var(--gold-soft); color: var(--fg); }
.msg-body .chat-callout.is-warning { border-left-color: #d6992e; background: rgba(214,153,46,.09); }
.msg-body .chat-callout.is-danger { border-left-color: var(--danger); background: rgba(209,73,73,.09); }
.msg-body .chat-callout p { margin: 0; }
.msg-body table { width: 100%; margin: 7px 0; border-collapse: collapse; font-size: 8.5px; }
.msg-body th, .msg-body td { padding: 4px 6px; border: 1px solid var(--border); text-align: left; vertical-align: top; }

.msg-body td { color: var(--fg); opacity: .8; }
</style>

<header class="top">

function formatBytes(size) {
  if (!size) return '';
  if (size < 1024) return size + ' Б';
  if (size < 1024 * 1024) return (size / 1024).toFixed(1) + ' КБ';
  return (size / (1024 * 1024)).toFixed(1) + ' МБ';
}

function formatDate(value) {
  if (!value) return '';
  const date = new Date(value);
  return date.toLocaleDateString([], { day: 'numeric', month: 'short' });
}

async function api(path, method = 'GET', body) {
  const response = await fetch(API + path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await response.text();
  if (!response.ok) {
    let detail = text || ('HTTP ' + response.status);
    try { const parsed = JSON.parse(text); if (parsed && parsed.detail) detail = parsed.detail; } catch {}
    throw new Error(detail);
  }
  return text ? JSON.parse(text) : null;
}

function showError(message) {
  $('errorText').textContent = message || '';

function localOnly() {
  return !!(projectInfo && projectInfo.local_only);

function providerAllowed(item) {
  return !localOnly() || (item.kind === 'api' && item.local_api);

function availableProviders() {
  return providers.filter((item) => item.installed && item.enabled && (providerAllowed(item) || (chat && item.id === chat.provider_id)));
}

function currentProvider() {
  return providers.find((item) => item.id === $('provider').value) || null;
}

function providerIsRemote(item) {
  return item ? (item.kind === 'api' ? !item.local_api : true) : false;
}

function providerHost(item) {
  if (item && item.kind !== 'api') return 'внешний CLI-провайдер';
  if (item && item.api_url) {
    try { return new URL(item.api_url).host; } catch { return item.api_url; }

  return (item && item.name) || 'AI';
}

function needsConsent(item) {
  if (!item || localOnly() || !providerIsRemote(item)) return false;
  const consents = (projectInfo && projectInfo.remote_consents) || [];
  return consents.indexOf(item.id) < 0;
}

async function grantConsent(providerId) {
  const current = (projectInfo && projectInfo.remote_consents) || [];
  if (current.indexOf(providerId) >= 0) return;
  const data = await api('/project', 'PATCH', { remote_consents: current.concat([providerId]) });
  projectInfo = data.project;
  renderSafety();
}

      + '<div class="consent-target"><strong>' + esc(item.name) + '</strong><span>' + esc(providerHost(item)) + '</span></div>'
      + '<small>Согласие запоминается для проекта и провайдера — повторно спрашивать не будем.</small>'
      + '<div class="consent-actions"><button type="button" data-consent="no">Отмена</button><button type="button" class="primary" data-consent="yes">Разрешить и отправить</button></div>'
      + '</div>';

      const button = event.target.closest('[data-consent]');
      if (!button) return;
      const value = button.dataset.consent === 'yes';
      overlay.remove();
      resolve(value);
    });
    document.body.appendChild(overlay);
  });
}

function renderMarkdown(value) {
  const NL = String.fromCharCode(10);
  const TICK = String.fromCharCode(96);
  const inline = (line) => {
    let html = esc(line);
    html = html.split(TICK).map((part, index) => index % 2 === 1 ? '<code class="inline">' + part + '</code>' : part).join('');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
    return html;
  };
  const isSeparator = (line) => line.indexOf('-') >= 0 && /^\s*\|?[\s:|-]+\|?\s*$/.test(line);
  const cells = (line) => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map((cell) => cell.trim());
  const lines = String(value || '').split(NL);
  const out = [];
  let paragraph = [];
  let code = [];
  let inCode = false;
  let index = 0;
  const flush = () => {
    if (!paragraph.length) return;
    out.push('<p>' + paragraph.join('<br/>') + '</p>');
    paragraph = [];
  };
  while (index < lines.length) {
    const raw = lines[index];
    const line = raw.replace(/\s+$/, '');
    if (line.trimStart().startsWith(TICK.repeat(3))) {
      flush();
      if (inCode) {
        out.push('<pre class="code"><code>' + esc(code.join(NL)) + '</code></pre>');
        code = [];
        inCode = false;
      } else inCode = true;
      index += 1;
      continue;
    }
    if (inCode) { code.push(raw); index += 1; continue; }
    if (!line.trim()) { flush(); index += 1; continue; }
    if (/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)) { flush(); out.push('<hr/>'); index += 1; continue; }
    const heading = /^(#{1,3})\s+(.*)$/.exec(line);
    if (heading) {
      flush();
      const level = heading[1].length;
      out.push('<h' + level + '>' + inline(heading[2]) + '</h' + level + '>');
      index += 1;
      continue;
    }
    if (line.indexOf('|') >= 0 && index + 1 < lines.length && isSeparator(lines[index + 1])) {
      flush();
      const header = cells(line);
      const rows = [];
      index += 2;
      while (index < lines.length && lines[index].indexOf('|') >= 0 && lines[index].trim()) {
        rows.push(cells(lines[index]));
        index += 1;
      }
      out.push('<table class="chat-table"><thead><tr>' + header.map((cell) => '<th>' + inline(cell) + '</th>').join('') + '</tr></thead><tbody>' + rows.map((row) => '<tr>' + row.map((cell) => '<td>' + inline(cell) + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
      continue;
    }
    if (/^\s*>/.test(line)) {
      flush();
      const quote = [];
      while (index < lines.length && /^\s*>/.test(lines[index])) {
        quote.push(lines[index].replace(/^\s*>\s?/, ''));
        index += 1;
      }
      const joined = quote.join('<br/>');
      const lower = joined.toLowerCase();
      const tone = /важно|внимание|warning|осторожно/.test(lower) ? ' is-warning' : /нельзя|ошибка|опасн|запрещ|error/.test(lower) ? ' is-danger' : '';
      out.push('<blockquote class="chat-callout' + tone + '"><p>' + inline(joined) + '</p></blockquote>');
      continue;
    }
    const unordered = /^\s*[-*]\s+(.*)$/.exec(line);
    const ordered = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (unordered || ordered) {
      flush();
      const orderedList = !!ordered;
      const items = [];
      while (index < lines.length) {
        const match = orderedList ? /^\s*\d+[.)]\s+(.*)$/.exec(lines[index]) : /^\s*[-*]\s+(.*)$/.exec(lines[index]);
        if (!match) break;
        items.push('<li>' + inline(match[1]) + '</li>');
        index += 1;
      }
      out.push(orderedList ? '<ol>' + items.join('') + '</ol>' : '<ul>' + items.join('') + '</ul>');
      continue;
    }
    paragraph.push(inline(line));
    index += 1;
  }
  flush();
  if (inCode && code.length) out.push('<pre class="code"><code>' + esc(code.join(NL)) + '</code></pre>');
  return out.join('');
}

function scheduleRender() {
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = null; render(); }, 140);
}

function renderHistory() {
  const query = ($('historySearch').value || '').trim().toLowerCase();
  const rows = chats.filter((item) => ((item.title || '') + ' ' + (item.last_message || '')).toLowerCase().includes(query));
  $('historyList').innerHTML = rows.length
    ? rows.map((item) => {
        const active = chat && chat.id === item.id;
        const actions = pendingDelete === item.id
          ? '<span class="history-confirm"><button data-confirm-delete="' + esc(item.id) + '" class="is-danger">Удалить</button><button data-cancel-delete="1">Отмена</button></span>'
          : '<button class="history-delete" data-delete="' + esc(item.id) + '" title="Удалить чат"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button>';
        return '<div class="history-item ' + (active ? 'is-active' : '') + '" data-chat="' + esc(item.id) + '"><span class="history-copy"><b>' + esc(item.title) + '</b><small>' + esc(item.last_message || 'Пустой чат') + '</small></span><time class="history-date">' + esc(formatDate(item.updated_at)) + '</time>' + actions + '</div>';
      }).join('')
    : '<div class="empty-tip">Чатов пока нет</div>';
}

function renderProviders() {
  const available = availableProviders();
  $('provider').innerHTML = available.map((item) => '<option value="' + esc(item.id) + '"' + (providerAllowed(item) ? '' : ' disabled') + '>' + esc(item.name) + (providerAllowed(item) ? '' : ' (внешний)') + '</option>').join('') || '<option value="">Нет локальных провайдеров</option>';
  if (chat) $('provider').value = chat.provider_id || (available[0] && available[0].id) || '';
  else $('provider').value = defaultProviderId && available.some((item) => item.id === defaultProviderId) ? defaultProviderId : ((available[0] && available[0].id) || '');
  renderModels();
}

function fallbackEfforts(providerId) {
  if (providerId === 'codex') return ['low', 'medium', 'high', 'xhigh'];
  if (providerId === 'claude') return ['low', 'medium', 'high', 'xhigh', 'max'];
  return [];
}

function currentCatalogModel() {
  return catalogGroups.flatMap((group) => group.models).find((item) => item.id === (chat && chat.model)) || null;
}

async function loadCatalog(providerId) {
  if (!providerId || catalogProvider === providerId) return;
  catalogProvider = providerId;
  catalogLoading = true;
  catalogGroups = [];
  renderModels();
  try {
    const data = await api('/providers/' + encodeURIComponent(providerId) + '/catalog');
    if (catalogProvider === providerId) catalogGroups = data.groups || [];
  } catch {
    if (catalogProvider === providerId) catalogGroups = [];
  } finally {
    if (catalogProvider === providerId) {
      catalogLoading = false;
      renderModels();
    }
  }
}

function renderModels() {
  const provider = currentProvider();
  if (provider) void loadCatalog(provider.id);
  const query = ($('modelSearch').value || '').trim().toLowerCase();
  const groups = catalogGroups
    .map((group) => ({ ...group, models: group.models.filter((model) => ((model.name || '') + ' ' + model.id).toLowerCase().includes(query)) }))
    .filter((group) => group.models.length);
  if (catalogLoading) {
    $('modelGroups').innerHTML = '<div class="editor-model-empty">Загрузка моделей…</div>';
  } else if (!groups.length) {
    $('modelGroups').innerHTML = '<div class="editor-model-empty">' + (catalogGroups.length ? 'Ничего не найдено' : 'У провайдера нет списка моделей') + '</div>';
  } else {
    $('modelGroups').innerHTML = groups.map((group) => '<div class="editor-model-group"><div class="editor-model-head"><span>' + esc(group.label) + '</span><b>' + group.models.length + '</b></div>'
      + group.models.map((model) => '<button class="editor-model-row ' + (chat && chat.model === model.id ? 'is-active' : '') + '" data-model="' + esc(model.id) + '"><span>' + esc(model.name) + '</span>' + (model.free ? '<em>Free</em>' : '') + '</button>').join('')
      + '</div>').join('');
  }
  renderEffort();
}

function renderEffort() {
  const model = currentCatalogModel();
  const values = ['auto', ...((model && model.efforts && model.efforts.length) ? model.efforts : fallbackEfforts(chat && chat.provider_id))];
  $('effort').innerHTML = values.map((value) => '<option value="' + esc(value) + '">' + esc(value === 'auto' ? 'Auto' : value) + '</option>').join('');
  const current = (chat && chat.effort) || 'auto';
  $('effort').value = values.includes(current) ? current : 'auto';
}

function selectedTaskIds() {
  if (!chat) return [];
  if (Array.isArray(chat.task_ids) && chat.task_ids.length) return chat.task_ids.map(String);
  return chat.task_id ? [String(chat.task_id)] : [];
}

function renderTaskMenu() {
  if (!contextOpen) {
    $('contextMenu').className = 'context-menu';
    return;
  }
  const query = ($('taskSearch').value || '').trim().toLowerCase();
  const selected = menuSelection;
  const rows = tasks.filter((task) => (task.title + ' ' + (task.goal || '')).toLowerCase().includes(query));
  const project = '<button class="context-option ' + (selected.size === 0 ? 'is-active' : '') + '" data-context-project="1"><span class="context-check">' + (selected.size === 0 ? '✓' : '') + '</span><span class="context-option-copy"><b>Весь проект</b><small>Общий контекст проекта</small></span></button>';
  const items = rows.map((task) => {
    const engine = engineMeta(task.engine);
    const kind = typeMeta(task.type);
    const active = selected.has(task.id);
    return '<button class="context-option ' + (active ? 'is-active' : '') + '" data-task-id="' + esc(task.id) + '"><span class="context-check">' + (active ? '✓' : '') + '</span><span class="context-option-copy"><b>' + esc(task.title) + '</b><small><span class="task-kind" title="' + esc(kind.label) + '">' + kind.icon + '<span>' + esc(kind.label) + '</span></span><span class="task-engine" title="' + esc(engine.label) + '"><img src="' + engine.icon + '" alt=""/></span><span>' + esc(task.status) + '</span></small></span></button>';
  }).join('');
  $('contextMenuList').innerHTML = project + (items || '<div class="editor-model-empty">Задачи не найдены</div>');
  $('contextMenu').className = 'context-menu is-open';
}

function renderTasks() {
  const selected = selectedTaskIds();
  const selectedTasks = tasks.filter((task) => selected.includes(task.id));
  const label = selectedTasks.length === 0
    ? 'Весь проект'
    : selectedTasks.length === 1
      ? selectedTasks[0].title
      : selectedTasks.length + (selectedTasks.length < 5 ? ' задачи' : ' задач');
  $('contextLabel').textContent = label;
  $('contextIcon').textContent = selectedTasks.length ? '✓' : '▦';
  $('runQuick').style.display = selected.length ? '' : 'none';
  if (contextOpen) renderTaskMenu();
}

function actionsHtml(message) {
  if (!message.actions || !message.actions.length) return '';
  return '<div class="actions">' + message.actions.map((action) => {
    const taskId = action.result && action.result.task_id ? String(action.result.task_id) : '';
    const buttons = action.status === 'pending'
      ? '<div class="action-buttons"><button class="primary" data-action="approve" data-id="' + esc(action.id) + '">' + (action.type === 'start_agent_run' ? 'Запустить' : 'Подтвердить') + '</button><button data-action="reject" data-id="' + esc(action.id) + '">Отклонить</button></div>'
      : '<small class="action-state is-' + esc(action.status) + '">' + (action.status === 'approved' ? 'Выполнено' : action.status === 'rejected' ? 'Отклонено' : 'Ошибка') + '</small>';
    const result = taskId ? '<button class="link-btn" data-open-task="' + esc(taskId) + '">Открыть задачу →</button>' : '';
    const error = action.error ? '<small class="action-error">' + esc(action.error) + '</small>' : '';
    return '<div class="action is-' + esc(action.status) + '"><div class="action-head"><span class="action-icon">▣</span><span class="action-copy"><b>' + esc(actionLabel(action)) + '</b><small>' + esc(actionDetail(action)) + '</small></span></div>' + buttons + error + result + '</div>';
  }).join('') + '</div>';
}

function actionLabel(action) {
  if (action.type === 'create_task') return 'Создать задачу';
  if (action.type === 'update_task') return 'Обновить задачу';
  if (action.type === 'update_project_settings') return 'Изменить настройки проекта';
  return 'Запустить агента';
}

function actionDetail(action) {
  const payload = action.payload || {};
  if (action.type === 'create_task') return String(payload.title || 'Задача из чата');
  if (action.type === 'update_project_settings') {
    const parts = [];
    if (payload.isolation) parts.push(payload.isolation === 'worktree' ? 'worktree' : payload.isolation === 'sandbox' ? 'песочница-копия' : 'прямо в проекте');
    if (payload.local_only === true) parts.push('только локальные');
    if (payload.egress_guard === true) parts.push('сетевой щит');
    if (payload.max_parallel_runs) parts.push('запусков: ' + payload.max_parallel_runs);
    if (payload.token_budget) parts.push('лимит: ' + payload.token_budget);
    return parts.join(' · ') || 'Настройки проекта';
  }
  const parts = [String(payload.task_id || '')];
  if (payload.status) parts.push('статус: ' + payload.status);
  if (payload.provider_id) parts.push(payload.provider_id);
  return parts.filter(Boolean).join(' · ');
}

function attachmentsHtml(message) {
  if (!message.attachments || !message.attachments.length || !chat) return '';
  return '<div class="media">' + message.attachments.map((item) => {
    const url = API + '/chats/' + encodeURIComponent(chat.id) + '/attachments/' + encodeURIComponent(item.id);

  }).join('') + '</div>';
}
