function activityState(activity, running, failed) {
  if (failed) return 'error';
  if (!running) return activity.length ? 'success' : 'idle';
  const last = [...activity].reverse().find((item) => item.status === 'running') || activity[activity.length - 1];
  if (!last) return 'thinking';
  if (last.kind === 'command') return 'running';
  if (last.kind === 'file') return 'editing';
  if (last.kind === 'thought') return 'thinking';
  const label = String(last.label || '').toLowerCase();
  if (label.includes('read')) return 'reading';
  if (label.includes('explor') || label.includes('search')) return 'searching';
  if (label.includes('edit')) return 'editing';
  if (label.includes('command')) return 'running';
  return 'thinking';
}

function durationText(ms) {
  if (!ms) return '';
  return ms < 1000 ? ms + 'ms' : (ms / 1000).toFixed(ms < 10000 ? 1 : 0) + 's';
}

function activityRows(activity) {
  return activity.map((item) => {
    const label = String(item.label || '');
    const icon = item.kind === 'thought' ? ACTIVITY_ICONS.thought : item.kind === 'command' ? ACTIVITY_ICONS.command : item.kind === 'file' ? ACTIVITY_ICONS.file : item.kind === 'network' ? ACTIVITY_ICONS.network : label.toLowerCase().includes('read') ? ACTIVITY_ICONS.read : ACTIVITY_ICONS.tool;
    const output = item.output ? '<pre>' + esc(item.output) + '</pre>' : '';
    const flags = (item.flags || []).map((flag) => '<span class="act-badge is-' + esc(flag) + '">' + esc(FLAG_LABELS[flag] || flag) + '</span>').join('');
    return '<details class="act-row is-' + esc(item.status) + '"><summary><span class="act-ico">' + icon + '</span><span class="act-copy"><b>' + esc(label) + flags + '</b>' + (item.detail ? '<small>' + esc(item.detail) + '</small>' : '') + '</span>' + (item.duration_ms ? '<span class="act-time">' + esc(durationText(item.duration_ms)) + '</span>' : '') + (item.output ? '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>' : '<span></span>') + '</summary>' + output + '</details>';
  }).join('');
}

function egressHtml(egress) {
  if (!egress) return '';
  const files = egress.files || [];
  const attachments = egress.attachments || 0;
  if (!files.length && !attachments && !(egress.network && egress.network.length)) return '';
  const network = egress.network || [];
  const label = (files.length || attachments)
    ? (egress.remote ? 'Отправлено модели' : 'Локально прочитано') + ':'
    : 'Сеть:';
  const parts = [];
  if (files.length) parts.push(files.length + ' файлов · ' + formatBytes(egress.file_bytes));
  if (attachments) parts.push(attachments + ' вложений · ' + formatBytes(egress.attachment_bytes));
  if (!files.length && !attachments) parts.push(network.length + ' домен(ов)');
  const rows = files.map((file) => '<li><span>' + esc(file.path) + '</span><small>' + esc(formatBytes(file.bytes)) + '</small></li>').join('');
  const netRows = network.map((item) => '<li><span>' + esc(item.host) + '</span><small>' + (item.allowed ? esc(item.count + '×') : 'заблокировано') + '</small></li>').join('');
  return '<div class="egress"><div class="egress-head"><span>' + label + ' ' + esc(parts.join(' · ')) + '</span><b>' + esc(egress.provider_name || 'AI') + '</b></div>'
    + (files.length ? '<details class="egress-files"><summary>Файлы</summary><ul>' + rows + '</ul></details>' : '')
    + (network.length ? '<details class="egress-files"><summary>Сеть</summary><ul>' + netRows + '</ul></details>' : '')
    + '</div>';
}

function activityHtml(activity, running) {
  const items = activity || [];
  const flagged = items.filter((item) => item.flags && item.flags.length).length;
  const external = items.filter((item) => item.flags && item.flags.indexOf('external') >= 0).length;
  const warnText = external ? external + ' вне проекта' : flagged + ' требует внимания';
  const warn = flagged ? '<span class="act-warn"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5M12 17h.01"/></svg>' + warnText + '</span>' : '';
  if (!items.length) {
    return running ? '<div class="act is-running"><div class="act-head"><span class="act-spin"></span><span>Kova работает</span><span class="act-dots"><i></i><i></i><i></i></span></div></div>' : '';
  }
  if (running) {
    return '<div class="act is-running"><div class="act-head"><span class="act-spin"></span><span>Kova работает</span>' + warn + '<span class="act-dots"><i></i><i></i><i></i></span></div><div class="act-list">' + activityRows(items) + '</div></div>';
  }
  return '<details class="act"><summary class="act-head"><span>Действия (' + items.length + ')</span>' + warn + '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></summary><div class="act-list">' + activityRows(items) + '</div></details>';
}

async function copyText(text, button) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    try { document.execCommand('copy'); } finally { area.remove(); }
  }
  if (button) {
    const label = button.textContent;
    button.textContent = 'Скопировано';
    button.classList.add('is-copied');
    setTimeout(() => { button.textContent = label; button.classList.remove('is-copied'); }, 1600);
  }
}

function chatSafety(provider) {
  const external = (chat && chat.external_paths && chat.external_paths.length) || 0;
  const onlyLocal = localOnly();
  const remote = provider ? (provider.kind === 'api' ? !provider.local_api : true) : false;
  if (onlyLocal && remote) return { label: 'Заблокировано', title: 'Включён режим только локальных моделей. Этот провайдер отправляет данные в интернет, поэтому отправка заблокирована.' };
  if (onlyLocal && provider && !remote) return { label: 'Локально', title: 'Локальный API: данные не уходят за пределы этой машины. Чат только читает проект.' };
  if (!provider) return { label: onlyLocal ? 'Локально' : 'Без изменений', title: onlyLocal ? 'Включён режим только локальных моделей. Внешние провайдеры заблокированы.' : 'Чат не меняет файлы проекта.' };
  if (provider.kind === 'api') return { label: 'Без инструментов', title: 'API-чат отвечает текстом и не получает доступ к файлам, командам или сети проекта.' };
  if (provider.id === 'opencode') return {
    label: external ? 'Читает + папки' : 'Читает проект',
    title: external
      ? 'OpenCode читает проект и ' + external + ' явно разрешённых внешних папок. Изменения, команды, сеть и MCP заблокированы.'
      : 'OpenCode в чате читает только папку проекта. Внешние пути, изменения файлов, команды, сеть и MCP заблокированы.'
  };
  if ((provider.chat_args && provider.chat_args.length) || (provider.read_only_args && provider.read_only_args.length)) return {
    label: external ? 'Без изменений + папки' : 'Без изменений',
    title: external
      ? 'Чат работает без правок и команд; разрешено чтение проекта и ' + external + ' внешних папок.'
      : 'Чат работает без правок файлов и без команд. Внешние пути контролируются возможностями CLI.'
  };
  return { label: 'Не настроен', title: 'Для этого CLI не заданы безопасные аргументы чата. Добавь аргументы «только чтение» в настройках провайдера.' };
}

function renderSafety() {
  const provider = chat ? providers.find((item) => item.id === chat.provider_id) : null;
  const safety = chatSafety(provider);
  const pill = $('safetyPill');
  if (!pill) return;
  pill.textContent = safety.label;
  pill.title = safety.title;
  pill.className = 'safety-pill' + (safety.label === 'Чат не настроен' ? ' is-off' : '');
}

function renderExternalPaths() {
  const node = $('externalPaths');
  if (!node || document.activeElement === node) return;
  node.value = ((chat && chat.external_paths) || []).join(String.fromCharCode(10));
}

function render() {
  renderSafety();
  renderExternalPaths();
  renderProviders();
  renderTasks();
  renderEffort();
  renderHistory();
  const scope = chat ? (chat.scope === 'task' ? 'Чат по задаче' : 'Чат по проекту') : 'Проект и задачи';
  $('subtitle').textContent = chat ? scope : 'Проект и задачи';

  if (!chat) {
    $('thread').innerHTML = welcomeHtml(true);
    return;
  }

  const messages = (chat.messages || []).map((message) => {
    const isUser = message.role === 'user';
    const canTask = !isUser && message.content && !(message.actions && message.actions.length);
    return '<article class="msg ' + (isUser ? 'user' : 'assistant') + '">'
      + '<div class="msg-head"><span class="msg-avatar">' + (isUser ? '●' : avatarHtml(activityState(message.activity || [], false, String(message.content || '').startsWith('Ошибка')), 24)) + '</span><span class="msg-name">' + (isUser ? 'Вы' : 'Kova') + '</span></div>'
      + (isUser ? '' : activityHtml(message.activity || [], false) + egressHtml(message.egress))
      + '<div class="msg-body">' + renderMarkdown(message.content) + '</div>'
      + attachmentsHtml(message)
      + actionsHtml(message)
      + '<div class="msg-foot"><small>' + esc(new Date(message.created_at).toLocaleString()) + '</small>'
      + (isUser ? '' : '<span class="msg-actions"><button class="link-btn" data-copy-message="' + esc(message.id) + '">Копировать</button>'
        + (canTask ? '<button class="link-btn" data-make-task="' + esc(message.id) + '">Создать задачу</button>' : '') + '</span>')
      + '</div></article>';
  }).join('');

  const stream = chat.status === 'running'
    ? '<article class="msg assistant stream"><div class="msg-head"><span class="msg-avatar">' + avatarHtml(activityState(chat.activity || [], true, false), 24) + '</span><span class="msg-name">Kova</span></div>' + activityHtml(chat.activity || [], true) + '</article>'
    : '';

  const content = messages + stream;
  $('thread').innerHTML = content || welcomeHtml(false);
  $('thread').scrollTop = $('thread').scrollHeight;
}

function renderPending() {
  $('pending').innerHTML = pending.map((item, index) => {
    const preview = item.kind === 'image'
      ? '<img src="' + item.dataUrl + '" alt=""/>'
      : item.kind === 'video'
        ? '<video src="' + item.dataUrl + '" muted preload="metadata"></video>'
        : '<span class="action-icon">▣</span>';
    return '<div class="pending-item">' + preview + '<span><b>' + esc(item.name) + '</b><small>' + formatBytes(item.size) + '</small></span><button data-remove="' + index + '">×</button></div>';
  }).join('');
  $('attach') && ($('attach').className = 'attach');
}

function connectList() {
  if (listStream) listStream.close();
  listStream = new EventSource(API + '/chats/events');
  listStream.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'chats') { chats = data.chats || []; renderHistory(); if (!chat) render(); }
    } catch {}
  };
}

function connectChat(id) {
  if (chatStream) chatStream.close();
  chatStream = new EventSource(API + '/chats/' + encodeURIComponent(id) + '/events');
  chatStream.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'deleted') {
        chat = null;
        showError('');
        vscode.postMessage({ type: 'chatChanged', chatId: '' });
        render();
        return;
      }
      if (data.type === 'chat' && data.chat && chat && data.chat.id === chat.id) {
        chat = data.chat;
        scheduleRender();
      }
    } catch {}
  };
}

async function refreshChats() {
  chats = await api('/chats');
  renderHistory();
}

async function openChat(id) {
  if (!id) return;
  try {
    showError('');
    chat = await api('/chats/' + encodeURIComponent(id));
    pending = [];
    historyOpen = false;
    $('historyPanel').className = 'history-panel';
    vscode.postMessage({ type: 'chatChanged', chatId: id });
    renderPending();
    render();
    resizeComposer();
    connectChat(id);
  } catch (error) {
    const message = error.message || String(error);
    if (/not found/i.test(message)) {
      chat = null;
      showError('');
      vscode.postMessage({ type: 'chatChanged', chatId: '' });
      render();
      return;
    }
    showError(message);
  }
}

async function newChat() {
  const provider = currentProvider() || availableProviders()[0];
  if (!provider) { showError('Нет доступных провайдеров. Настрой их в Kova Hub → Агенты.'); return; }
  try {
    showError('');
    const created = await api('/chats', 'POST', {
      title: 'Новый чат',
      scope: 'project',
      provider_id: provider.id,
      model: provider.default_model || (provider.models && provider.models[0]) || '',
      effort: provider.default_effort || 'auto',
    });
    await refreshChats();
    await openChat(created.id);
  } catch (error) {
    showError(error.message || String(error));
  }
}

async function updateChat(payload) {
  if (!chat) return;
  try {
    chat = await api('/chats/' + encodeURIComponent(chat.id), 'PATCH', payload);
    render();
  } catch (error) {
    showError(error.message || String(error));
  }
}

function resizeComposer() {
  const node = $('text');
  if (!node) return;
  node.style.height = 'auto';
  const max = Math.min(300, Math.round(window.innerHeight * 0.42));
  node.style.height = Math.min(node.scrollHeight, max) + 'px';
  node.style.overflowY = node.scrollHeight > max ? 'auto' : 'hidden';
}

async function send() {
  const text = $('text').value.trim();
  if (busy || (chat && chat.status === 'running') || (!text && !pending.length)) return;
  if (!chat) {
    const provider = currentProvider() || availableProviders()[0];
    if (!provider) { showError('Нет доступных провайдеров. Настрой их в Kova Hub → Агенты.'); return; }
    try {
      chat = await api('/chats', 'POST', {
        title: 'Новый чат',
        scope: 'project',
        provider_id: provider.id,
        model: provider.default_model || (provider.models && provider.models[0]) || '',
        effort: provider.default_effort || 'auto',
      });
      await refreshChats();
      connectChat(chat.id);
      vscode.postMessage({ type: 'chatChanged', chatId: chat.id });
    } catch (error) {
      showError(error.message || String(error));
      return;
    }
  }
  const provider = providers.find((item) => item.id === (chat && chat.provider_id)) || currentProvider();
  if (provider && localOnly() && providerIsRemote(provider)) {
    showError('Включён режим только локальных моделей. Выбери локальный API в настройках провайдера.');
    return;
  }
  if (provider && needsConsent(provider)) {
    const allowed = await askConsent(provider);
    if (!allowed) return;
    try {
      await grantConsent(provider.id);
    } catch (error) {
      showError(error.message || String(error));
      return;
    }
  }
  const attachments = pending.map((item) => ({ name: item.name, mime: item.mime, data: item.data }));
  $('text').value = '';
  resizeComposer();
  busy = true;
  showError('');
  try {
    chat = await api('/chats/' + encodeURIComponent(chat.id) + '/messages', 'POST', { text, attachments });
    pending = [];
    renderPending();
    render();
    connectChat(chat.id);
  } catch (error) {
    showError(error.message || String(error));
    $('text').value = text;
    resizeComposer();
  } finally {
    busy = false;
  }
}

async function addFiles(files) {
  if (!files || !files.length) return;
  const room = 4 - pending.length;
  if (room <= 0) { showError('Можно прикрепить не больше 4 файлов.'); return; }
  const rows = [];
  for (const file of Array.from(files).slice(0, room)) {
    if (file.size > 12_000_000) { showError(file.name + ': файл больше 12 МБ'); continue; }
    const dataUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => resolve('');
      reader.readAsDataURL(file);
    });
    if (!dataUrl) continue;
    rows.push({
      name: file.name,
      mime: file.type || 'application/octet-stream',
      size: file.size,
      kind: file.type.startsWith('image/') ? 'image' : file.type.startsWith('video/') ? 'video' : file.type.startsWith('text/') ? 'text' : 'file',
      dataUrl,
      data: dataUrl.split(',')[1] || '',
    });
  }
  pending = pending.concat(rows).slice(0, 4);
  renderPending();
  showError('');
}

async function decide(actionId, decision) {
  if (!chat) return;
  const action = (chat.messages || []).flatMap((message) => message.actions || []).find((item) => item.id === actionId);
  busy = true;
  showError('');
  try {
    chat = await api('/chats/' + encodeURIComponent(chat.id) + '/actions/' + encodeURIComponent(actionId), 'POST', { decision });
    vscode.postMessage({ type: 'refreshTrees' });
    if (decision === 'approve' && action && action.type === 'update_project_settings') {
      busy = false;
      await reload();
      return;
    }
    render();
  } catch (error) {
    showError(error.message || String(error));
  } finally {
    busy = false;
  }
}

async function makeTask(messageId) {
  if (!chat) return;
  const message = (chat.messages || []).find((item) => item.id === messageId);
  if (!message) return;
  const title = message.content.split('\n').map((line) => line.replace(/^#+\s*/, '').trim()).find(Boolean)?.slice(0, 80) || 'Задача из чата';
  try {
    await api('/tasks', 'POST', { title, type: 'code', engine: projectEngine, goal: message.content, criteria: [] });
    tasks = await api('/tasks');
    vscode.postMessage({ type: 'refreshTrees' });
    renderTasks();
    showError('');
  } catch (error) {
    showError(error.message || String(error));
  }
}

$('new').onclick = () => void newChat();
$('errorClose').onclick = () => showError('');
$('historyBtn').onclick = () => { historyOpen = !historyOpen; $('historyPanel').className = 'history-panel' + (historyOpen ? ' is-open' : ''); renderHistory(); };
$('historyClose').onclick = () => { historyOpen = false; $('historyPanel').className = 'history-panel'; };
$('historySearch').oninput = renderHistory;
$('send').onclick = () => void send();
$('file').onclick = () => $('fileInput').click();
$('fileInput').onchange = (event) => { void addFiles(event.target.files); event.target.value = ''; };
$('settingsBtn').onclick = () => $('settingsPanel').classList.toggle('is-open');
$('settingsClose').onclick = () => $('settingsPanel').classList.remove('is-open');
$('contextButton').onclick = () => {
  contextOpen = !contextOpen;
  if (contextOpen) {
    $('taskSearch').value = '';
    menuSelection = new Set(selectedTaskIds());
    renderTaskMenu();
  } else renderTaskMenu();
};
$('taskSearch').oninput = renderTaskMenu;
$('contextMenuList').addEventListener('click', (event) => {
  if (!chat) return;
  if (event.target.closest('[data-context-project]')) {
    menuSelection = new Set();
    renderTaskMenu();
    void updateChat({ scope: 'project', task_id: '', task_ids: [] });
    return;
  }
  const row = event.target.closest('[data-task-id]');
  if (!row) return;
  const id = row.dataset.taskId;
  if (menuSelection.has(id)) menuSelection.delete(id); else menuSelection.add(id);
  renderTaskMenu();
  const ids = [...menuSelection];
  if (!ids.length) void updateChat({ scope: 'project', task_id: '', task_ids: [] });
  else void updateChat({ scope: 'task', task_id: ids[0], task_ids: ids });
});
$('provider').onchange = (event) => {
  const provider = providers.find((item) => item.id === event.target.value);
  void updateChat({ provider_id: event.target.value, model: (provider && (provider.default_model || (provider.models && provider.models[0]))) || '' });
};
$('modelSearch').oninput = renderModels;
$('effort').onchange = (event) => void updateChat({ effort: event.target.value });
$('externalPaths').addEventListener('change', () => {
  const paths = $('externalPaths').value.split(String.fromCharCode(10)).map((item) => item.trim()).filter(Boolean);
  void updateChat({ external_paths: paths });
});
$('modelGroups').addEventListener('click', (event) => {
  const button = event.target.closest('[data-model]');
  if (!button) return;
  const model = catalogGroups.flatMap((group) => group.models).find((item) => item.id === button.dataset.model);
  const current = (chat && chat.effort) || 'auto';
  const effort = model && (current === 'auto' || model.efforts.includes(current)) ? current : 'auto';
  void updateChat({ model: button.dataset.model, effort });
});
$('run').onclick = () => { const ids = selectedTaskIds(); if (ids.length) { vscode.postMessage({ type: 'openRun', taskId: ids[0] }); $('settingsPanel').classList.remove('is-open'); } };
$('runQuick').onclick = () => { const ids = selectedTaskIds(); if (ids.length) vscode.postMessage({ type: 'openRun', taskId: ids[0] }); };
$('text').addEventListener('input', resizeComposer);
$('text').addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); void send(); } });

$('thread').addEventListener('click', (event) => {
  const copyButton = event.target.closest('[data-copy-message]');
  if (copyButton && chat) {
    const message = (chat.messages || []).find((item) => item.id === copyButton.dataset.copyMessage);
    if (message) void copyText(message.content, copyButton);
    return;
  }
  const prompt = event.target.closest('[data-prompt]');
  if (prompt) { $('text').value = prompt.dataset.prompt; $('text').focus(); return; }
  const recent = event.target.closest('[data-chat]');
  if (recent) { void openChat(recent.dataset.chat); return; }
  const all = event.target.closest('[data-all]');
  if (all) { historyOpen = true; $('historyPanel').className = 'history-panel is-open'; renderHistory(); return; }
  const target = event.target.closest('button');
  if (!target) return;
  if (target.dataset.makeTask) void makeTask(target.dataset.makeTask);
  if (target.dataset.openTask) vscode.postMessage({ type: 'openTask', taskId: target.dataset.openTask });
  if (target.dataset.action && target.dataset.id) void decide(target.dataset.id, target.dataset.action);
});

$('historyList').addEventListener('click', async (event) => {
  const deleteButton = event.target.closest('[data-delete]');
  if (deleteButton) {
    event.stopPropagation();
    pendingDelete = deleteButton.dataset.delete;
    renderHistory();
    return;
  }
  const confirmButton = event.target.closest('[data-confirm-delete]');
  if (confirmButton) {
    event.stopPropagation();
    const id = confirmButton.dataset.confirmDelete;
    try {
      await api('/chats/' + encodeURIComponent(id), 'DELETE');
      if (chat && chat.id === id) {
        chat = null;
        if (chatStream) { chatStream.close(); chatStream = null; }
        vscode.postMessage({ type: 'chatChanged', chatId: '' });
        render();
      }
      chats = await api('/chats');
      pendingDelete = '';
      renderHistory();
    } catch (error) {
      showError(error.message || String(error));
    }
    return;
  }
  const cancel = event.target.closest('[data-cancel-delete]');
  if (cancel) { event.stopPropagation(); pendingDelete = ''; renderHistory(); return; }
  const row = event.target.closest('[data-chat]');
  if (row) void openChat(row.dataset.chat);
});

window.addEventListener('message', (event) => {
  const message = event.data;
  if (!message) return;
  if (message.type === 'openChat') void openChat(message.chatId);
  else if (message.type === 'reload') { void reload(); }
  else if (message.type === 'error') showError(message.message || 'Ошибка');
});

async function reload() {
  try {
    const [chatRows, providerData, taskRows, project] = await Promise.all([
      api('/chats'),
      api('/providers'),
      api('/tasks'),
      api('/project').catch(() => null),
    ]);
    chats = chatRows;
    providers = (providerData && providerData.providers) || [];
    defaultProviderId = (providerData && providerData.default_provider) || '';
    tasks = taskRows;
    projectInfo = (project && project.project) || null;
    projectEngine = (projectInfo && projectInfo.engine) || 'generic';
    if (chat) {
      try {
        chat = await api('/chats/' + encodeURIComponent(chat.id));
      } catch {
        chat = null;
        showError('');
        vscode.postMessage({ type: 'chatChanged', chatId: '' });
      }
    }
    render();
    connectList();
    if (chat) connectChat(chat.id);
  } catch (error) {
    showError(error.message || String(error));
  }
}

async function boot() {
  await reload();
  if (initial) await openChat(initial);
}

void boot();
</script>
</body>
</html>
