[project]
name = "kova-core"
version = "0.4.2"
description = "Local engine for Kova Hub: tasks, capsules, checks, snapshots, ledger"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "Pillow>=10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
kova-core = "kova_core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kova_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
